[project]
name = "fluxopro"
version = "0.1.0"
description = "Nucleo de plataforma de leitura de fluxo de mercado futuro B3 (WDO/WIN)"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fluxopro*"]
